<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CyberGuard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🛡️ CyberGuard
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </div>

    </nav>


    <main class="checker-page">

        <section class="checker-card">

            <div class="page-header">

                <h1>🔐 Welcome Back</h1>

                <p>Login to continue using CyberGuard.</p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="analyze-btn"
                >
                    Login
                </button>


                <p id="loginMessage"></p>


                <p>
                    Don't have an account?

                    <a href="register.html">
                        Register here
                    </a>
                </p>

            </form>

        </section>

    </main>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();

                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();

                    const password =
                        document
                            .getElementById("password")
                            .value;

                    const message =
                        document
                            .getElementById("loginMessage");

                    message.textContent =
                        "Logging in...";

                    try {

                        const response =
                            await fetch(
                                "/api/login",
                                {

                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({

                                            email: email,

                                            password: password

                                        })

                                }
                            );

                        const data =
                            await response.json();

                        if (data.success) {

                            message.textContent =
                                "Login successful!";

                            setTimeout(
                                function() {

                                    window.location.href =
                                        "dashboard.html";

                                },
                                1000
                            );

                        }

                        else {

                            message.textContent =
                                data.message ||
                                "Invalid email or password.";

                        }

                    }

                    catch (error) {

                        console.error(error);

                        message.textContent =
                            "Unable to connect to server.";

                    }

                }
            );

    </script>

</body>

</html>
