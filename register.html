<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CyberGuard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🛡️ CyberGuard
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </div>

    </nav>


    <main class="checker-page">

        <section class="checker-card">

            <div class="page-header">

                <h1>📝 Create Your Account</h1>

                <p>Register to use CyberGuard.</p>

            </div>


            <form id="registerForm">


                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="analyze-btn"
                >

                    Create Account

                </button>


                <p id="registerMessage"></p>


                <p>

                    Already have an account?

                    <a href="login.html">
                        Login here
                    </a>

                </p>


            </form>

        </section>

    </main>


    <script>

        document
            .getElementById("registerForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const name =
                        document
                            .getElementById("name")
                            .value
                            .trim();


                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const confirmPassword =
                        document
                            .getElementById("confirmPassword")
                            .value;


                    const message =
                        document
                            .getElementById(
                                "registerMessage"
                            );


                    if (
                        password !==
                        confirmPassword
                    ) {

                        message.textContent =
                            "Passwords do not match.";

                        return;

                    }


                    message.textContent =
                        "Creating account...";


                    try {

                        const response =
                            await fetch(
                                "http://127.0.0.1:5000/api/register",
                                {

                                    method: "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json"

                                    },

                                    body:
                                        JSON.stringify({

                                            name: name,

                                            email: email,

                                            password: password

                                        })

                                }
                            );


                        const data =
                            await response.json();


                        if (data.success) {

                            message.textContent =
                                "Registration successful! You can now login.";


                            setTimeout(
                                function() {

                                    window.location.href =
                                        "login.html";

                                },

                                1500
                            );

                        }

                        else {

                            message.textContent =
                                data.message;

                        }

                    }

                    catch (error) {

                        console.error(error);

                        message.textContent =
                            "Unable to connect to server.";

                    }

                }
            );

    </script>

</body>

</html>
